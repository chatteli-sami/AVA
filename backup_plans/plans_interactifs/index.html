<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Façade AVA - Cliquable</title>
<style>
  body {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f5f5f5; /* fond général du body */
    
  }

  .plan {
    width: 100%;
    height: 100vh;
    display: flex;
    overflow: hidden;
    position: relative; /* nécessaire pour les .etage */
  }

.plan img {
  width: 100%;
  height: 100%;
  object-fit:contain;      /* remplit tout l’écran */
  object-position: top;   /* s’assure que le haut de l’image est visible */
  display: block;
}


  .etage {
    position: absolute;
    left: 0;
    width: 100%;
    cursor: pointer;
    /* retirer la couleur de fond de base */
    background: rgba(255, 215, 0, 0); /* transparent */
    transition: background 0.3s ease;
  }

  .etage:hover {
    background: rgba(200, 200, 200, 0.5); /* gris clair sur survol */
    cursor: pointer; /* optionnel, montre que c'est cliquable */
}
 .logo {
      position: fixed;       /* reste en haut à droite */
      top: 20px;
      right: 90px;
      width: 120px;
      height: auto;
      z-index: 1000;
    }
 .oiseau {
      position: fixed;
      top: 10px;
      left: -108px;   /* commence hors écran à gauche */
      width: 60px;
      z-index: 999;
      opacity: 0;
    }

</style>

</head>
<body>
    <img src="logoava.avif" alt="Logo Résidence" class="logo"> 
      <img src="Oiseau.png" alt="Oiseau" class="oiseau">

  <div class="plan">
    <img src="Facade.jpeg" alt="Façade AVA">
      </div>
    <!-- Définir les zones cliquables par étage -->
    <div class="etage" style="top:1.5%; height:24.5%;" onclick="window.location.href='./3eme etage/3etage.html'"></div>
    <div class="etage" style="top:26%; height:17.4%;" onclick="window.location.href='./2eme etage/2etage.html'"></div>
    <div class="etage" style="top:43.4%; height:24%;" onclick="window.location.href='./1ere etage/1etage.html'"></div>
    <div class="etage" style="top:67.3%; height:19%;" onclick="window.location.href='./RDC/rdc.html'"></div>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>

// Animation du logo à l'arrivée
    gsap.from(".logo", {
      duration: 1.5,
      opacity: 0,
      x: 350,     // arrive de la droite
      ease: "bounce.out"
    });

    // Effet respiration infini
  
     gsap.to(".oiseau", {
      duration: 4,
      opacity: 1,
      x: window.innerWidth - 150,  // vole jusqu'à la zone du logo
      ease: "power1.inOut",
      delay: 1
    });

    // Petit effet de battement d'ailes (respiration)
    gsap.to(".oiseau", {
      y: "+=10",
      duration: 1,
      repeat: -1,
      yoyo: true,
      ease: "sine.inOut",
      delay: 1
    });
</script>
</body>
</html>
