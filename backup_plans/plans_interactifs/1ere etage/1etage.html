<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>1ere étage</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background:#f5f5f5;
  }

  img {
    width: 100%;
    height: 100%;
    object-fit: contain; /* l'image entière est visible */
    display: block;
    background-color:#f5f5f5;
  }

  .appartement {
    position: absolute;
    cursor: pointer;
    background: rgba(0,0,0,0); /* transparent par défaut */
    transition: background 0.3s ease;
  }

  .appartement:hover {
    background: rgba(154, 185, 197, 0.267); /* gris semi-transparent sur survol */
  }
   /* Bouton retour */
    .back-btn {
      position: fixed;
      bottom: 30px;
      left: 30px;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #b0b0b0; /* gris clair */
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.3s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      z-index: 1000;
    }

    /* Icône flèche */
    .back-btn svg {
      width: 20px;
      height: 20px;
      fill: white;
    }

    /* Effet hover */
    .back-btn:hover {
      background: #555;   /* devient gris foncé */
      transform: scale(1.1);
    }

</style>
</head>
<body>
    <img src="./1er et.png" alt="Écriture" style="
  position: absolute;
  top: 20px;      /* distance depuis le haut */
  left: 20px;     /* distance depuis la gauche */
  width: 180px;   /* largeur de l'image */
  height: auto;   /* garde les proportions */
  z-index: 15;    /* au-dessus des autres éléments */
">
  <img src="1etage.jpg" alt="Plan RDC">
   <div class="appartement" style="top:1.5%; left:13.5%; width:36%; height:50%;" onclick="window.location.href='appart1_1.html'"></div>

    <div class="appartement" style="top:1.5%; left:50%; width:36%; height:50%;" onclick="window.location.href='appart1_2.html'"></div>

    <div class="appartement" style="top:49%; left:13.5%; width:36%; height:50%;" onclick="window.location.href='appart1_4.html'"></div>
   
    <div class="appartement" style="top:49%; left:50%; width:36%; height:50%;" onclick="window.location.href='appart1_3.html'"></div>
     <div class="back-btn" onclick="history.back()">
    <!-- Flèche gauche -->
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <path d="M15 18l-6-6 6-6"/>
    </svg>
  </div>
</body>
</html>
